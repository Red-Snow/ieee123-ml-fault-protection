name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Cache feeder model
        uses: actions/cache@v4
        with:
          path: |
            feeder/*.dss
            feeder/*.DSS
            feeder/BusCoords.dat
            feeder/LICENSE-OpenDSS.txt
          key: feeder-${{ hashFiles('src/ieee123fp/feeder.py') }}
      - run: ieee123fp fetch
      - name: Fast tests
        run: pytest -m "not slow" -q
      - name: End-to-end smoke test (tiny dataset)
        run: pytest -m slow -q
